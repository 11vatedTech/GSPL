name: GSPL Canon CI
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Pin npm version
        run: npm i -g npm@10
      - run: npm ci
      - run: npm run typecheck:all
      - run: npm run build
      - run: npm test
      - run: npm run test:property
      - run: npm run test:fuzz:ci
      - run: npm run test:mutation:ci
      - run: npm run test:archive-adversarial
      - run: npm run fixtures:generate
      - run: npm run check:roundtrip
      - run: npm run check:restart-reconstruction
      - run: npm run check:packages
      - run: npm run check:determinism
      - run: npm run check:conformance
      - run: npm run check:tracked-source
      - run: npm run check:clean-source
      - run: npm run package:source
      - run: npm run check:source-archive
      - run: npm run check:archive-reproducibility
      - name: Write canonical-output manifest for this matrix identity
        env:
          RUN_ID: ${{ matrix.os }}-node${{ matrix.node }}
        run: npm run write:canonical-manifest
      - name: Upload canonical comparison files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gspl-canonical-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            artifacts/validation/canonical-output-manifest-${{ matrix.os }}-node${{ matrix.node }}.json
            artifacts/validation/canonical-output-manifest-${{ matrix.os }}-node${{ matrix.node }}.json.sha256
            build/gspl-canon-source.tar.gz
            build/gspl-canon-source.tar.gz.sha256
            build/gspl-canon-source-manifest.json
            build/gspl-canon-source-manifest.json.sha256

  hash-compare:
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download all four canonical artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/validation-matrix/
      - name: Compare canonical-output manifests
        run: |
          mkdir -p artifacts/validation
          for d in artifacts/validation-matrix/gspl-canonical-*/; do
            cp "$d"/* artifacts/validation/
          done
          npm run compare:canonical-manifests
